# Nginx top-level config for the production stack. Keeps things lean —
# real configuration lives in conf.d/default.conf so we can swap the
# domain / TLS certs without touching this file.

user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept       on;
    use                epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide the nginx version from response headers — small but free
    # information-disclosure win.
    server_tokens off;

    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time"'
        '}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Body size — accommodates the largest legitimate upload (resume /
    # PDF documents, capped at 10MB by master_file_types). Add a few MB
    # of headroom for multipart overhead.
    client_max_body_size 15M;

    # Compression for text-y responses. Avoid compressing already-
    # compressed types (images, PDFs).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # Per-IP rate-limiting buckets. Tuned generously — the app's own
    # ThrottlerGuard is the primary defence. This is just to absorb
    # bursty bot traffic before it reaches NestJS.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    include /etc/nginx/conf.d/*.conf;
}
