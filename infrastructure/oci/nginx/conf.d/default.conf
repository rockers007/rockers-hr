# Per-domain nginx config. Replace ${DOMAIN} substitutions before
# bringing the stack up — see scripts/deploy.sh which renders this file
# from a template using the values in .env.production.
#
# Layout:
#   /             → frontend (Next.js)
#   /api/v1/      → backend (NestJS)
#   /api/v1/health  is unauthenticated, used by uptime checks

# Upstreams — names must match the service names in docker-compose.
upstream rockers_frontend {
    server frontend:3000;
    keepalive 16;
}

upstream rockers_backend {
    server backend:4000;
    keepalive 16;
}

# ACME challenge + HTTPS redirect on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # Let's Encrypt challenge — the certbot client writes here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS server.
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name DOMAIN_PLACEHOLDER;

    # TLS — managed by certbot. Auto-renewal cron is set up on the host
    # and the renewed cert is reloaded into nginx via `nginx -s reload`.
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — faster TLS handshake, less leakage of who's
    # revoking certs.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers — the API server (helmet) sets its own; these
    # are for the HTML responses Nginx serves directly + a defence-in-
    # depth layer for the API.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options              "SAMEORIGIN" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection             "0" always;
    # CSP applies only to HTML responses from the frontend. Tightened
    # version of next.config.ts default. Add 3rd-party origins here
    # if you embed analytics, fonts, payment widgets etc.
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.cloudfront.net https://*.amazonaws.com https://*.oraclecloud.com https://*.oraclecloud.com.akamaized.net; connect-src 'self'; frame-ancestors 'self';" always;
    add_header Permissions-Policy           "camera=(), geolocation=(), microphone=(), payment=()" always;

    # Health probe — unauthenticated, no logging spam.
    location = /api/v1/health {
        access_log off;
        proxy_pass http://rockers_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Backend API — strict rate limit for /auth/*, lighter for the
    # rest. Long timeout for payslip-PDF generation + report exports.
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://rockers_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /api/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://rockers_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Next.js. _next/static is fingerprinted so we can cache hard.
    location /_next/static/ {
        proxy_pass http://rockers_frontend;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://rockers_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Don't expose nginx-status, /server-info, /.git etc.
    location ~ /\.(?!well-known) { deny all; }
}
