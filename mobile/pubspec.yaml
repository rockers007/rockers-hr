name: rockers_hr
description: Rockers HR — Leave Management Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP & networking
  http: ^1.2.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Secure storage for tokens
  flutter_secure_storage: ^9.2.2

  # Firebase push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Date formatting
  intl: ^0.19.0

  # Image caching
  cached_network_image: ^3.4.1

  # Pull to refresh
  pull_to_refresh_flutter3: ^2.0.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
